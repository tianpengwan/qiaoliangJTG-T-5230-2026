services:
  bridge-assessment:
    build: .
    image: bridge-assessment:5230
    container_name: bridge-assessment
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5230}:3000"
    environment:
      - TZ=Asia/Shanghai
      - PORT=3000
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASS=${AUTH_PASS:-qiaoliang@2026}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_TTL_HOURS=${AUTH_TTL_HOURS:-720}
      - VISION_PROVIDER=${VISION_PROVIDER:-disabled}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_BASE_URL=${VISION_BASE_URL:-https://api.openai.com/v1}
      - VISION_MODEL=${VISION_MODEL:-gpt-4o-mini}
      - VISION_TIMEOUT_MS=${VISION_TIMEOUT_MS:-60000}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
