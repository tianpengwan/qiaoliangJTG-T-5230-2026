<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>缺陷库管理 · 桥梁技术状况评定</title>
  <link rel="stylesheet" href="vendor/layui/css/layui.css" />
  <link rel="stylesheet" href="styles.css?v=13" />
  <style>
    html, body { height:100%; overflow:hidden; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Microsoft YaHei",-apple-system,Segoe UI,Roboto,sans-serif; }
    .topbar { height:58px; padding:0 20px; background:var(--blue); box-shadow:0 2px 6px rgba(0,0,0,.15); }
    .topbar .brand { font-size:17px; font-weight:700; }
    .topbar .brand .sub { font-size:12px; font-weight:400; opacity:.8; margin-left:8px; }
    .topbar .btn { color:var(--text); text-decoration:none; background:#fff; }
    .std-wrap { display:grid; grid-template-columns:minmax(420px, 46%) minmax(460px, 1fr); gap:14px; padding:14px 18px; max-width:1500px; height:calc(100vh - 58px); margin:0 auto; min-height:0; }
    .tree-card,.edit-card { background:#fff; border:1px solid var(--line); border-radius:8px; min-width:0; min-height:0; box-shadow:0 1px 2px rgba(20,42,66,.04); }
    .tree-card { display:flex; flex-direction:column; padding:12px; overflow:hidden; }
    .edit-card { padding:16px 18px; overflow:auto; scrollbar-gutter:stable; }
    .tree-card h3, .edit-card h3 { margin:0 0 8px; font-size:15px; }
    .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    .tabs-mini { display:flex; gap:6px; margin-bottom:10px; }
    .tabs-mini button { padding:5px 12px; border:1px solid var(--line,#e2e5ea); background:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
    .tabs-mini button.active { background:var(--blue2); color:#fff; border-color:var(--blue2); }
    #treePanel,#fivePanel { min-height:0; flex:1; display:flex; flex-direction:column; overflow:hidden; }
    #treePanel.hidden,#fivePanel.hidden { display:none !important; }
    .tree,#fiveList { flex:1; min-height:0; overflow:auto; padding-right:6px; scrollbar-gutter:stable; overscroll-behavior:contain; }
    .tree { font-size:13px; line-height:1.7; }
    .node { margin-left:0; }
    .row { display:flex; align-items:center; gap:6px; padding:3px 4px; border-radius:5px; }
    .row:hover { background:#f0f3f7; }
    .row.context-target { background:#eaf2fb; outline:1px solid #9fc5e8; }
    .row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row .w { color:#888; font-size:12px; }
    .twist { cursor:pointer; width:14px; display:inline-block; text-align:center; color:#888; }
    .lv1 > .name { font-weight:600; color:var(--blue); }
    .lv2 > .name { color:var(--blue2); }
    .lv3 > .name { color:#444; }
    .lv4 > .name { color:#333; }
    .lv5 > .name { color:#5b4b75; }
    .badge { font-size:11px; padding:1px 6px; border-radius:8px; background:#eef; color:#335; }
    .badge.major { background:#fdecea; color:#c0392b; }
    .badge.mc { background:#e8f5e9; color:#2e7d32; }
    .mini-btn { font-size:11px; padding:2px 7px; border:1px solid var(--line,#ccc); background:#fff; border-radius:5px; cursor:pointer; }
    .mini-btn.danger { color:#c0392b; }
    .mini-btn.primary { background:var(--blue2); color:#fff; border-color:var(--blue2); }
    .hidden { display:none !important; }
    .field { display:flex; align-items:center; gap:8px; margin:8px 0; }
    .field label { width:90px; color:#555; font-size:13px; }
    .field input, .field select, .field textarea { flex:1; min-width:0; padding:7px 9px; border:1px solid var(--line); border-radius:5px; font-size:13px; font-family:inherit; color:var(--text); }
    .field input:focus,.field select:focus,.field textarea:focus { outline:2px solid #c9def2; border-color:var(--blue2); }
    .scales-tbl { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
    .scales-tbl th, .scales-tbl td { border:1px solid var(--line,#e2e5ea); padding:5px; vertical-align:top; }
    .scales-tbl th { background:#f0f4f8; text-align:left; width:14%; }
    .scales-tbl td.q { width:43%; }
    .scales-tbl textarea { width:100%; border:none; resize:vertical; min-height:34px; overflow:hidden; font-size:13px; box-sizing:border-box; line-height:1.45; }
    .scales-tbl td.grid-selected { background:#dbeafe; outline:2px solid #2563eb; outline-offset:-2px; }
    .scales-tbl td.grid-selected textarea { background:transparent; }
    .paste-hint { margin-top:6px; color:#64748b; font-size:12px; }
    .standard-context-menu { position:fixed; z-index:1200; min-width:205px; padding:5px; background:#fff; border:1px solid #cbd5e1; border-radius:6px; box-shadow:0 8px 24px rgba(15,23,42,.18); }
    .standard-context-menu[hidden] { display:none; }
    .standard-context-menu button { display:block; width:100%; border:0; background:transparent; color:var(--text); font:inherit; font-size:13px; text-align:left; padding:8px 11px; border-radius:4px; cursor:pointer; white-space:nowrap; }
    .standard-context-menu button:hover:not(:disabled), .standard-context-menu button:focus-visible:not(:disabled) { background:#eaf2fb; color:var(--blue2); outline:0; }
    .standard-context-menu button:disabled { color:#94a3b8; cursor:not-allowed; }
    .hint { color:#888; font-size:12px; margin:4px 0; }
    .fc-item { display:flex; gap:8px; align-items:flex-start; padding:8px; border:1px solid var(--line,#e2e5ea); border-radius:6px; margin-bottom:8px; background:#fafbfc; }
    .fc-item textarea { flex:1; border:1px solid var(--line,#ccc); border-radius:5px; padding:6px; font-size:13px; }
    .fc-item .num { width:30px; font-weight:600; color:#888; text-align:right; }
    .muted { color:#888; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#243042; color:#fff; padding:9px 17px; border-radius:8px; opacity:0; transition:.2s; z-index:99; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    @media (max-width:900px) {
      html,body { overflow:auto; }
      .std-wrap { display:flex; flex-direction:column; height:auto; min-height:calc(100vh - 58px); padding:12px; }
      .tree-card { height:52vh; min-height:380px; }
      .edit-card { overflow:visible; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">缺陷库管理 <span class="sub">JTG/T H21—2011 · 桥型 / 部件 / 缺陷标度</span></div>
    <a class="btn" href="index.html">返回评定系统</a>
  </header>

  <div class="std-wrap">
    <div class="tree-card">
      <div class="tabs-mini">
        <button id="tabTree" class="active">桥梁结构树</button>
        <button id="tabFive">五类控制指标</button>
      </div>
      <div id="treePanel">
        <div class="toolbar">
          <button class="mini-btn primary" onclick="addRoot()">＋ 桥梁类型</button>
          <span class="hint" id="treeStat"></span>
        </div>
        <div id="tree" class="tree"></div>
      </div>
      <div id="fivePanel" class="hidden">
        <div class="toolbar"><button class="mini-btn primary" onclick="addFive()">＋ 新增指标</button></div>
        <div id="fiveList"></div>
      </div>
    </div>

    <div class="edit-card">
      <div id="editor">
        <h3>编辑区</h3>
        <p class="muted">在左侧选择某一级节点（桥梁类型 / 结构形式 / 部位 / 部件 / 缺陷类型）进行编辑；缺陷类型可维护“最高标度类别”及各标度的定性 / 定量描述。</p>
        <p class="muted">说明：标度与扣分值（DP）对应关系遵循标准表 4.1.1——最高标度类别 3 的缺陷仅设 1~3 标度，类别 4 设 1~4，类别 5 设 1~5。</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="vendor/layui/layui.js"></script>
  <script src="standard.js?v=7"></script>
</body>
</html>
