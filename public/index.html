<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3b66" />
  <meta name="description" content="依据 JTG/T 5230—2026《公路桥梁技术状况评定标准》的桥梁技术状况评定系统" />
  <title>桥梁技术状况评定 · JTG/T 5230—2026</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btnHome" aria-label="返回首页" title="返回首页">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
    </button>
    <div class="brand">
      <div class="brand-title">桥梁技术状况评定</div>
      <div class="brand-sub">JTG/T 5230—2026</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnServer" aria-label="服务器设置" title="服务器设置">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16v5H4zm0 9h16v5H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="7.5" r="1" fill="currentColor"/><circle cx="7" cy="16.5" r="1" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="btnNew" aria-label="新建桥梁" title="新建桥梁">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="app">
    <div class="empty-state">
      <div class="spinner"></div>
      <p>正在加载标准数据…</p>
    </div>
  </main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="overview"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 9h16M9 9v10" stroke="currentColor" stroke-width="1.7"/></svg><span>概况</span></button>
    <button data-tab="components"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 19V7l8-3 8 3v12M4 19h16M8 19v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span>构件评定</span></button>
    <button data-tab="result"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 19V9m7 10V5m7 14v-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>评定结果</span></button>
    <button data-tab="five"><svg viewBox="0 0 24 24" width="20" height="20"><path d="m5 12 4 4 10-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>5类指标</span></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" hidden></div>
  <div id="overlay" class="overlay" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
